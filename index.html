<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artist World S.R</title>
  <style>
    /* Smooth Scrolling */
    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #0f172a;
      color: #f8fafc;
      text-align: center;
    }

    /* Header & Navigation */
    header {
      background: #1e293b;
      padding: 20px;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    nav a {
      color: #38bdf8;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
      transition: color 0.3s ease;
    }

    nav a:hover {
      color: #f43f5e;
    }

    /* Hero Section Animation */
    .hero {
      padding: 60px 20px;
      animation: fadeIn 1.5s ease-in-out;
    }

    .hero img {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 4px solid #38bdf8;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
      transition: transform 0.5s ease, box-shadow 0.5s ease;
    }

    .hero img:hover {
      transform: scale(1.08) rotate(3deg);
      box-shadow: 0 0 35px rgba(244, 63, 94, 0.8);
    }

    .hero h1 {
      font-size: 2.5rem;
      margin-top: 20px;
      color: #f8fafc;
    }

    /* Gallery Section with Grid & Hover Effects */
    .gallery-section {
      padding: 50px 20px;
      background-color: #1e293b;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 25px;
      max-width: 1000px;
      margin: 30px auto 0 auto;
    }

    .art-card {
      background: #0f172a;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .art-card:hover {
      transform: translateY(-10px) scale(1.02);
      box-shadow: 0 12px 30px rgba(56, 189, 248, 0.4);
    }

    .art-card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .art-card:hover img {
      transform: scale(1.1);
    }

    .art-card h3 {
      margin: 15px 0 10px 0;
      color: #38bdf8;
    }

    /* Contact Form Styling */
    .contact-section {
      padding: 60px 20px;
      max-width: 500px;
      margin: 0 auto;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #fff;
      box-sizing: border-box;
    }

    button {
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.3s ease;
    }

    button:hover {
      transform: scale(1.03);
      background: linear-gradient(135deg, #f43f5e, #fb7185);
    }

    /* Keyframe Animations */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <header>
    <nav>
      <a href="#home">Home</a>
      <a href="#gallery">Gallery</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <section id="home" class="hero">
    <img src="Logo.png.jpeg" alt="Artist World S.R Logo">
    <h1>Artist World S.R</h1>
    <p>Welcome to my official art portfolio!</p>
  </section>

  <section id="gallery" class="gallery-section">
    <h2>Art Gallery</h2>
    <div class="gallery-grid">
      <div class="art-card">
        <img src="Logo.png.jpeg" alt="Artwork 1">
        <h3>Featured Logo Art</h3>
      </div>
    </div>
  </section>

  <section id="contact" class="contact-section">
    <h2>Contact Me</h2>
    <form action="https://formspree.io/f/mbglyrel" method="POST">
      <input type="text" name="name" placeholder="Your Name" required>
      <input type="email" name="email" placeholder="Your Email" required>
      <textarea name="message" rows="5" placeholder="Your Message" required></textarea>
      <button type="submit">Send Message</button>
    </form>
  </section>

</body>
</html>
